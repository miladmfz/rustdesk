name: Export Android Command Line Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android-tools:
    runs-on: windows-2025

    steps:
      - name: Find Android command-line tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT: $env:ANDROID_SDK_ROOT"

          if ($env:ANDROID_HOME) {
            $sdkRoot = $env:ANDROID_HOME
          }
          elseif ($env:ANDROID_SDK_ROOT) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          else {
            throw "ANDROID_HOME and ANDROID_SDK_ROOT are empty."
          }

          if (-not (Test-Path $sdkRoot)) {
            throw "Android SDK directory does not exist: $sdkRoot"
          }

          $cmdlineRoot = Join-Path $sdkRoot "cmdline-tools"

          if (-not (Test-Path $cmdlineRoot)) {
            throw "cmdline-tools directory does not exist: $cmdlineRoot"
          }

          Write-Host "Searching inside: $cmdlineRoot"

          $sdkManager = Get-ChildItem `
            -Path $cmdlineRoot `
            -Filter "sdkmanager.bat" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $sdkManager) {
            Write-Host "Contents of Android SDK:"
            Get-ChildItem $sdkRoot -Recurse -Depth 3 |
              Select-Object FullName

            throw "sdkmanager.bat was not found."
          }

          Write-Host "sdkmanager found:"
          Write-Host $sdkManager.FullName

          $binDirectory = $sdkManager.Directory
          $sourceDirectory = $binDirectory.Parent.FullName

          Write-Host "Command-line tools source:"
          Write-Host $sourceDirectory

          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            "android-command-line-tools"

          $destination = Join-Path $artifactRoot "latest"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceDirectory "*") `
            -Destination $destination `
            -Recurse `
            -Force

          $copiedSdkManager = Join-Path `
            $destination `
            "bin\sdkmanager.bat"

          if (-not (Test-Path $copiedSdkManager)) {
            throw "sdkmanager.bat was not copied correctly."
          }

          Write-Host "Testing copied sdkmanager:"
          & $copiedSdkManager --version

          Write-Host "Artifact directory:"
          Get-ChildItem $artifactRoot -Recurse |
            Select-Object FullName

      - name: Upload Android command-line tools
        uses: actions/upload-artifact@v4
        with:
          name: android-command-line-tools-windows
          path: ${{ runner.temp }}\android-command-line-tools
          retention-days: 7
          if-no-files-found: error
