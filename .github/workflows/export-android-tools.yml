name: Export Android Command Line Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android-tools:
    runs-on: windows-2025

    steps:
      - name: Download latest Android command-line tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $page = Invoke-WebRequest `
            -Uri "https://developer.android.com/studio" `
            -UseBasicParsing

          $pattern = 'https://dl\.google\.com/android/repository/commandlinetools-win-[0-9]+_latest\.zip'

          $match = [regex]::Match($page.Content, $pattern)

          if (-not $match.Success) {
            throw "Latest Windows command-line tools URL was not found."
          }

          $downloadUrl = $match.Value

          Write-Host "Download URL:"
          Write-Host $downloadUrl

          $zipPath = Join-Path $env:RUNNER_TEMP "android-command-line-tools.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "android-extracted"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "android-command-line-tools"
          $destination = Join-Path $artifactRoot "latest"

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $zipPath `
            -UseBasicParsing

          $zipSize = (Get-Item $zipPath).Length

          Write-Host "Downloaded size: $zipSize bytes"

          if ($zipSize -lt 100MB) {
            throw "Downloaded file is too small."
          }

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractPath `
            -Force

          $source = Join-Path $extractPath "cmdline-tools"

          if (-not (Test-Path (Join-Path $source "bin\sdkmanager.bat"))) {
            throw "sdkmanager.bat was not found."
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $source "*") `
            -Destination $destination `
            -Recurse `
            -Force

          $sdkManager = Join-Path $destination "bin\sdkmanager.bat"

          Write-Host "Testing sdkmanager:"
          & $sdkManager --version

      - name: Upload Android command-line tools
        uses: actions/upload-artifact@v4
        with:
          name: android-command-line-tools-windows
          path: ${{ runner.temp }}\android-command-line-tools
          retention-days: 7
          if-no-files-found: error
