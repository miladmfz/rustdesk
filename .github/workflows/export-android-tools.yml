name: Export Android Command Line Tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android-tools:
    runs-on: windows-2025

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup modern Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Package Android command-line tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT: $env:ANDROID_SDK_ROOT"

          if ($env:ANDROID_SDK_ROOT) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          elseif ($env:ANDROID_HOME) {
            $sdkRoot = $env:ANDROID_HOME
          }
          else {
            throw "Android SDK environment variables are empty."
          }

          $cmdlineRoot = Join-Path $sdkRoot "cmdline-tools"

          if (-not (Test-Path $cmdlineRoot)) {
            throw "cmdline-tools directory was not found: $cmdlineRoot"
          }

          $sdkManager = Get-ChildItem `
            -Path $cmdlineRoot `
            -Filter "sdkmanager.bat" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $sdkManager) {
            Get-ChildItem $cmdlineRoot -Recurse |
              Select-Object FullName

            throw "sdkmanager.bat was not found."
          }

          Write-Host "Found sdkmanager:"
          Write-Host $sdkManager.FullName

          $binDirectory = $sdkManager.Directory.FullName
          $sourceDirectory = Split-Path $binDirectory -Parent

          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            "android-command-line-tools"

          $destination = Join-Path $artifactRoot "latest"

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Copy-Item `
            -Path (Join-Path $sourceDirectory "*") `
            -Destination $destination `
            -Recurse `
            -Force

          $copiedSdkManager = Join-Path `
            $destination `
            "bin\sdkmanager.bat"

          if (-not (Test-Path $copiedSdkManager)) {
            throw "Copied sdkmanager.bat was not found."
          }

          Write-Host "Testing packaged sdkmanager:"
          & $copiedSdkManager --version

          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager test failed with exit code $LASTEXITCODE"
          }

          Write-Host "Package completed successfully."

      - name: Upload Android command-line tools
        uses: actions/upload-artifact@v4
        with:
          name: android-command-line-tools-windows
          path: ${{ runner.temp }}\android-command-line-tools
          retention-days: 7
          if-no-files-found: error
